<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0a07" />
    <title>SmallSQL</title>
    <script>
      // Pick the theme before first paint: saved choice, else the OS preference.
      try {
        var saved = localStorage.getItem('smallsql-theme')
        var light = window.matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.dataset.theme = saved || (light ? 'light' : 'dark')
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
